aid: investly
name: Investly
description: >-
  Investly is a European fintech invoice-financing marketplace that helps growing
  small and medium-sized businesses unlock working capital by financing their
  outstanding 30-180 day invoices. Businesses sell their approved invoices through
  a reverse-auction marketplace where investors bid to fund them, giving merchants
  the best available price from multiple funding providers and access to cash in
  1-3 working days rather than waiting on customer payment terms. Founded by Siim
  Maivel and operating across Estonia and the United Kingdom, Investly is backed by
  Speedinvest, Startup Wise Guys, and Founders Capital. The platform serves
  established businesses across manufacturing, wholesale, construction, logistics,
  and business-services sectors and has funded invoices worth tens of millions of
  pounds to date. Investly runs a production HAL/HATEOAS backend API at
  api.investly.co, though it does not currently publish a public developer portal,
  OpenAPI specification, or API reference documentation.
